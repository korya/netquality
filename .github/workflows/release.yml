name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
env:
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.0' }
      - run: go test -race -count=1 ./...
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.0' }
      - name: Extract release notes
        run: scripts/changelog-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md
      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          pkg=github.com/korya/netquality/internal/buildinfo
          ldflags="-s -w -X $pkg.Version=$GITHUB_REF_NAME -X $pkg.Commit=$GITHUB_SHA -X $pkg.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=netquality_${GITHUB_REF_NAME#v}_${os}_${arch}
            out=dist/$name; mkdir -p "$out"
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$out/nq$ext" ./cmd/nq
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$out/nqserver$ext" ./cmd/nqserver
            cp LICENSE README.md "$out/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -czf "$out.tar.gz" -C dist "$name"; fi
            rm -r "$out"
          done
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - name: Create or update release
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Trigger pkg.go.dev indexing
        run: |
          # Asking the module proxy for the version makes it fetch the tag;
          # pkg.go.dev then picks it up from the proxy index within minutes.
          curl -sSf "https://proxy.golang.org/github.com/korya/netquality/@v/$GITHUB_REF_NAME.info"
